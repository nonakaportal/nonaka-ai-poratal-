<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password · Nonaka Financial Partners</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/style.css">
<style>
  body { margin: 0; }
  .reset-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .reset-card {
    max-width: 420px;
    width: 100%;
  }
</style>
</head>
<body>

<div class="auth-bg">
  <div class="auth-bg-orb orb1"></div>
  <div class="auth-bg-orb orb2"></div>
  <div class="auth-bg-orb orb3"></div>
</div>

<div class="reset-wrap">
  <div class="auth-card reset-card" id="reset-card">

    <h2 class="auth-card-title">Set a new password</h2>
    <p class="auth-card-sub" id="reset-sub">Choose a new password for your account.</p>

    <div id="reset-form">
      <div class="form-group">
        <label class="form-label">New password</label>
        <input class="form-control" id="reset-password" type="password" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label class="form-label">Confirm password</label>
        <input class="form-control" id="reset-password-confirm" type="password" autocomplete="new-password">
      </div>
      <div id="reset-error" style="display:none;margin-bottom:12px;padding:10px;background:var(--negative-bg);color:var(--negative);border-radius:8px;font-size:13px;"></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="submitReset()">
        <span id="reset-btn-text">Reset Password</span>
        <span id="reset-btn-spin" class="spinner" style="display:none;width:16px;height:16px;border-width:2px;"></span>
      </button>
    </div>

    <div id="reset-success" style="display:none;">
      <div style="padding:12px;background:var(--positive-bg);color:var(--positive);border-radius:8px;font-size:14px;margin-bottom:16px;text-align:center;">
        ✓ Password updated. You can log in now.
      </div>
      <a class="btn btn-primary" style="width:100%;justify-content:center;text-decoration:none;" href="index.html">Go to login →</a>
    </div>

    <div id="reset-invalid" style="display:none;">
      <div style="padding:12px;background:var(--negative-bg);color:var(--negative);border-radius:8px;font-size:14px;margin-bottom:16px;text-align:center;">
        This reset link is invalid or has expired. Please request a new one from the login page.
      </div>
      <a class="btn btn-secondary" style="width:100%;justify-content:center;text-decoration:none;" href="index.html">Back to login</a>
    </div>

  </div>
</div>

<script>
  // Supabase appends the recovery session to the URL as a hash fragment
  // (#access_token=...&type=recovery&...) rather than a query string, so
  // it's never sent to the server — only readable here in the browser.
  const params = new URLSearchParams(window.location.hash.replace(/^#/, ""));
  const accessToken = params.get("access_token");
  const type = params.get("type");

  if (!accessToken || type !== "recovery") {
    document.getElementById("reset-form").style.display = "none";
    document.getElementById("reset-sub").style.display = "none";
    document.getElementById("reset-invalid").style.display = "block";
  }

  async function submitReset() {
    const password = document.getElementById("reset-password").value;
    const confirm = document.getElementById("reset-password-confirm").value;
    const errorEl = document.getElementById("reset-error");
    const btnText = document.getElementById("reset-btn-text");
    const btnSpin = document.getElementById("reset-btn-spin");

    errorEl.style.display = "none";

    if (!password || password.length < 6) {
      errorEl.textContent = "Password must be at least 6 characters.";
      errorEl.style.display = "block";
      return;
    }

    if (password !== confirm) {
      errorEl.textContent = "Passwords do not match.";
      errorEl.style.display = "block";
      return;
    }

    btnText.style.display = "none";
    btnSpin.style.display = "inline-block";

    try {
      const response = await fetch("/api/auth/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ access_token: accessToken, password })
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.error || "Failed to reset password");
      }

      document.getElementById("reset-form").style.display = "none";
      document.getElementById("reset-sub").style.display = "none";
      document.getElementById("reset-success").style.display = "block";

    } catch (error) {
      errorEl.textContent = error.message || "Something went wrong. Please try again.";
      errorEl.style.display = "block";
      btnText.style.display = "inline";
      btnSpin.style.display = "none";
    }
  }
</script>

</body>
</html>
